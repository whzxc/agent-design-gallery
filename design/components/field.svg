<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280">
<!-- design:tokens -->
<style>
:root{--font-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", Inter, "WenQuanYi Zen Hei", sans-serif;--font-mono:"SF Mono", ui-monospace, Menlo, Consolas, "JetBrains Mono", monospace;--text-title:15px;--text-section:14px;--text-body:13px;--text-meta:12px;--text-caption:11px;--radius-dialog:16px;--radius-panel:14px;--radius-menu:12px;--radius-field:9px;--radius-row:8px;--radius-artboard:6px;--toolbar-height:44px;--field-height:32px;--row-height:28px;--control-size:32px;--canvas:#ecece9;--dot:#d2d2ce;--surface:#ffffff;--surface-section:#f5f5f3;--surface-sunken:#f1f1ee;--border:#e2e2de;--text:#1c1c1a;--text-secondary:#5b5b57;--text-tertiary:#7c7c77;--accent:#1c1c1a;--on-accent:#ffffff;--danger:#c2453b;--tooltip:#1c1c1a;--on-tooltip:#ffffff;--shadow-float:0 1px 2px rgb(0 0 0 / 6%), 0 8px 24px rgb(0 0 0 / 8%);--shadow-menu:0 2px 4px rgb(0 0 0 / 6%), 0 12px 32px rgb(0 0 0 / 14%);--elev-float:url(#elev-float-light);--elev-menu:url(#elev-menu-light)}
:root[data-theme="dark"]{--canvas:#121212;--dot:#262626;--surface:#1f1f1f;--surface-section:#191919;--surface-sunken:#2a2a2a;--border:#2d2d2d;--text:#efefed;--text-secondary:#a8a8a4;--text-tertiary:#85857f;--accent:#efefed;--on-accent:#1c1c1a;--danger:#f08b80;--tooltip:#efefed;--on-tooltip:#1c1c1a;--shadow-float:0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 45%);--shadow-menu:0 2px 4px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 55%);--elev-float:url(#elev-float-dark);--elev-menu:url(#elev-menu-dark)}
@media (prefers-color-scheme: dark){:root:not([data-theme]){--canvas:#121212;--dot:#262626;--surface:#1f1f1f;--surface-section:#191919;--surface-sunken:#2a2a2a;--border:#2d2d2d;--text:#efefed;--text-secondary:#a8a8a4;--text-tertiary:#85857f;--accent:#efefed;--on-accent:#1c1c1a;--danger:#f08b80;--tooltip:#efefed;--on-tooltip:#1c1c1a;--shadow-float:0 1px 2px rgb(0 0 0 / 40%), 0 8px 24px rgb(0 0 0 / 45%);--shadow-menu:0 2px 4px rgb(0 0 0 / 40%), 0 12px 32px rgb(0 0 0 / 55%);--elev-float:url(#elev-float-dark);--elev-menu:url(#elev-menu-dark)}}
text{font-family:var(--font-ui);dominant-baseline:central}
.only-dark{display:none}
:root[data-theme="dark"] .only-light{display:none}:root[data-theme="dark"] .only-dark{display:inline}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .only-light{display:none}:root:not([data-theme]) .only-dark{display:inline}}
.mono{font-family:var(--font-mono)}
.note{font-family:var(--font-mono);font-size:var(--text-caption);fill:var(--text-tertiary)}
</style>
<defs data-design-tokens="">
<filter id="elev-float-light" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1"/><feOffset dx="0" dy="1" result="o0"/><feFlood style="flood-color:rgb(0 0 0 / 6%)"/><feComposite in2="o0" operator="in" result="s0"/><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="0" dy="8" result="o1"/><feFlood style="flood-color:rgb(0 0 0 / 8%)"/><feComposite in2="o1" operator="in" result="s1"/><feMerge><feMergeNode in="s0"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="elev-menu-light" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="o0"/><feFlood style="flood-color:rgb(0 0 0 / 6%)"/><feComposite in2="o0" operator="in" result="s0"/><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dx="0" dy="12" result="o1"/><feFlood style="flood-color:rgb(0 0 0 / 14%)"/><feComposite in2="o1" operator="in" result="s1"/><feMerge><feMergeNode in="s0"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="elev-float-dark" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="1"/><feOffset dx="0" dy="1" result="o0"/><feFlood style="flood-color:rgb(0 0 0 / 40%)"/><feComposite in2="o0" operator="in" result="s0"/><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dx="0" dy="8" result="o1"/><feFlood style="flood-color:rgb(0 0 0 / 45%)"/><feComposite in2="o1" operator="in" result="s1"/><feMerge><feMergeNode in="s0"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="elev-menu-dark" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dx="0" dy="2" result="o0"/><feFlood style="flood-color:rgb(0 0 0 / 40%)"/><feComposite in2="o0" operator="in" result="s0"/><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dx="0" dy="12" result="o1"/><feFlood style="flood-color:rgb(0 0 0 / 55%)"/><feComposite in2="o1" operator="in" result="s1"/><feMerge><feMergeNode in="s0"/><feMergeNode in="s1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- /design:tokens -->
<defs><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" style="fill:var(--dot)"/></pattern></defs>
<rect data-canvas="" width="920" height="280" style="fill:var(--canvas)"/>
<text x="40" y="46" class="note">search</text><g data-component="field" data-form="search" transform="translate(40 62)"><rect width="236" height="32" rx="9" style="fill:var(--surface-sunken)"/><g data-icon="search" transform="translate(10 9) scale(0.58333)" style="fill:none;stroke:var(--text-tertiary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></g><text x="32" y="16" style="fill:var(--text-tertiary);font-size:var(--text-body);font-weight:400">Find assets…</text><text x="226" y="16" text-anchor="end" style="fill:var(--text-tertiary);font-size:var(--text-meta);font-weight:400">⌘F</text></g><text x="300" y="46" class="note">search-active</text><g data-component="field" data-form="search-active" transform="translate(300 62)"><rect width="236" height="32" rx="9" style="fill:var(--surface);stroke:var(--accent)"/><g data-icon="search" transform="translate(10 9) scale(0.58333)" style="fill:none;stroke:var(--text-tertiary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="m21 21-4.34-4.34" /><circle cx="11" cy="11" r="8" /></g><text x="32" y="16" style="fill:var(--text);font-size:var(--text-body);font-weight:400">pill</text><g data-icon="x" transform="translate(212 9) scale(0.58333)" style="fill:none;stroke:var(--text-tertiary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></g></g><text x="560" y="46" class="note">picker</text><g data-component="field" data-form="picker" transform="translate(560 62)"><rect width="236" height="32" rx="9" style="fill:var(--surface-sunken)"/><g data-icon="folder" transform="translate(10 8) scale(0.66667)" style="fill:none;stroke:var(--text-secondary);stroke-width:2.625;stroke-linecap:round;stroke-linejoin:round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" /></g><text x="34" y="16" style="fill:var(--text);font-size:var(--text-body);font-weight:550">agent-remote-control</text><g data-icon="chevron-down" transform="translate(212 9) scale(0.58333)" style="fill:none;stroke:var(--text-tertiary);stroke-width:3;stroke-linecap:round;stroke-linejoin:round"><path d="m6 9 6 6 6-6" /></g></g><text x="40" y="118" class="note">input</text><g data-component="field" data-form="input" transform="translate(40 134)"><rect width="360" height="32" rx="9" style="fill:var(--surface-sunken)"/><text x="12" y="16" class="mono" style="fill:var(--text);font-size:var(--text-meta);font-weight:400">~/projects/arc/design</text></g><text x="440" y="118" class="note">input-error</text><g data-component="field" data-form="input-error" transform="translate(440 134)"><rect width="360" height="32" rx="9" style="fill:var(--surface-sunken);stroke:var(--danger)"/><text x="12" y="16" class="mono" style="fill:var(--text);font-size:var(--text-meta);font-weight:400">~/projects/empty</text></g><text x="40" y="190" class="note">input-empty</text><g data-component="field" data-form="input-empty" transform="translate(40 206)"><rect width="360" height="32" rx="9" style="fill:var(--surface-sunken)"/><text x="12" y="16" class="mono" style="fill:var(--text-tertiary);font-size:var(--text-meta);font-weight:400">/path/to/design</text></g>
</svg>
