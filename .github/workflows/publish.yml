name: Publish to npm
run-name: Publish ADG ${{ inputs.version }} to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in package.json to publish (for example, 0.9.0)
        required: true
        type: string

concurrency: npm-publish

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$RELEASE_VERSION" != "$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter the stable release version from package.json.' >&2
            exit 1
          fi
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm test
      - run: npm publish --access public
